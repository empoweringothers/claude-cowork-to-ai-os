name: Sanitized bug report
description: Report a reproducible problem without sharing real Cowork data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use fictional fixtures only. Do not attach real transcripts, files,
        screenshots, emails, account/workspace/session IDs, full home paths,
        hashes of private files, cookies, tokens, or authentication data.
  - type: input
    id: version
    attributes:
      label: Release version
      placeholder: v0.1.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized error
      description: Replace all personal paths and identifiers with fictional placeholders.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest fictional directory tree or fixture that reproduces the issue.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all real Cowork data and authentication material.
          required: true
